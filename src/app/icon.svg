<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Vantage "Node V" mark on the night-navy tile (Clear Horizon plan, section 5.5). -->
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a90d4"/>
      <stop offset="1" stop-color="#8fd16e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0c2a4f"/>
  <g fill="#ffffff" opacity="0.22">
    <circle cx="16" cy="16" r="2.6"/><circle cx="32" cy="16" r="2.6"/><circle cx="48" cy="16" r="2.6"/>
    <circle cx="16" cy="32" r="2.6"/><circle cx="48" cy="32" r="2.6"/>
    <circle cx="16" cy="48" r="2.6"/><circle cx="48" cy="48" r="2.6"/>
  </g>
  <polyline points="16,16 32,48 48,16" fill="none" stroke="url(#v)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="5.2" fill="#8fd16e"/>
